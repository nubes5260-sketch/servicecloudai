# ServiceCloud AI — despliegue en un servidor (VPS de Hostinger, VM de GCP u otro)
#
#   cp .env.produccion.example .env      # y completar APP_KEY, APP_URL y DB_PASSWORD
#   docker compose -f compose.prod.yaml up -d --build
#   docker compose -f compose.prod.yaml exec app php artisan db:seed --force   # datos demo (solo la primera vez)
#
# Diferencias con compose.yaml (desarrollo): usa la imagen "production" (código dentro de la imagen),
# no expone PostgreSQL ni incluye pgAdmin, y las contraseñas salen del .env del servidor.
# Guías: docs/DESPLIEGUE-HOSTINGER-VPS.md (con HTTPS: compose.https.yaml) · docs/DESPLIEGUE-GCP-VM.md

name: servicecloudai-prod

services:
  app:
    build:
      context: .
      target: production
    image: servicecloudai:prod
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:8080"
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: "5432"
    volumes:
      # Adjuntos de tickets (storage/app/private) persistentes entre actualizaciones
      - storage:/var/www/html/storage/app
    depends_on:
      pgsql:
        condition: service_healthy

  # Programador de tareas: sla:revisar cada 5 min, estado de contratos a diario
  scheduler:
    build:
      context: .
      target: production
    image: servicecloudai:prod
    restart: unless-stopped
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: "5432"
      AUTORUN_ENABLED: "false"   # las migraciones las ejecuta solo "app"
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy

  pgsql:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-servicecloud_ai}
      POSTGRES_USER: ${DB_USERNAME:-servicecloud}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      TZ: America/Lima
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Sin "ports": la base solo es accesible desde la red interna de Docker

volumes:
  pgdata:
  storage:
